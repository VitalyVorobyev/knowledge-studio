[package]
name = "packinspect-studio"
version = "0.1.0"
edition = "2021"
default-run = "packinspect-studio"

[lib]
name = "packinspect_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
